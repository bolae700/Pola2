    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #000000;
      color: #f1f5f9;
      margin: 0;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

      letter-spacing: -0.02em;
    }

    .brand-footer {

      letter-spacing: 0.12em;
    }

    .font-arabic {
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Range inputs */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px;
      width: 13px;
      border-radius: 50%;
      background: #5eead4;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(94, 234, 212, 0.9);
      margin-top: -3.5px;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #042f2e;
      border-radius: 4px;
    }

    /* Playlist scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(4, 47, 46, 0.3);
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #0d9488;
      border-radius: 8px;
    }

    const vizModeBtn = document.getElementById('vizModeBtn');
    const vizModeLabel = document.getElementById('vizModeLabel');
    const modeOverlay = document.getElementById('modeOverlay');
    const progressBar = document.getElementById('progressBar');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const trackCounter = document.getElementById('trackCounter');
    const liveBadge = document.getElementById('liveBadge');
    const photoEqualizer = document.getElementById('photoEqualizer');
    const playerView = document.getElementById('playerView');
    const playlistView = document.getElementById('playlistView');
    const openPlaylistBtn = document.getElementById('openPlaylistBtn');
    const closePlaylistBtn = document.getElementById('closePlaylistBtn');
    const playlistContainer = document.getElementById('playlistContainer');
    const visualizerCanvas = document.getElementById('visualizerCanvas');
    const bgCanvas = document.getElementById('bgCanvas');

    // Web Audio Analyser
    function initWebAudio() {
      if (sourceNode) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.8;
        audioDataArray = new Uint8Array(analyser.frequencyBinCount);

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (err) {
        console.warn('Web Audio note:', err);
      }
    }

    function loadTrack(index, autoPlay = false) {
      currentIndex = index;
      const track = TRACKS[currentIndex];
      audio.src = track.url;
      audio.load();
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      trackCounter.textContent = `${currentIndex + 1} / ${TRACKS.length}`;
      progressBar.value = 0;
      currentTimeLabel.textContent = '00:00';
      durationLabel.textContent = track.duration;
      renderPlaylist();

      if (autoPlay) {
        initWebAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        audio.play().then(() => {
          setPlayingState(true);
        }).catch((err) => {
          console.warn('Playback permission required:', err);
          setPlayingState(false);
        });
      }
    }

    async function togglePlay() {
      initWebAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        try {
          await audioCtx.resume();
        } catch(e) {}
      }

      if (audio.paused) {
        try {
          await audio.play();
          setPlayingState(true);
        } catch(err) {
          console.warn('Playback error:', err);
        }
      } else {
        audio.pause();
        setPlayingState(false);
      }
    }

    function setPlayingState(playing) {
      isPlaying = playing;
      if (playing) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        liveBadge.classList.remove('hidden');
        photoEqualizer.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        liveBadge.classList.add('hidden');
        photoEqualizer.classList.add('hidden');
      }
    }

    function playNext() {
      if (isShuffle) {
        const nextIdx = Math.floor(Math.random() * TRACKS.length);
        loadTrack(nextIdx, true);
      } else {
        loadTrack((currentIndex + 1) % TRACKS.length, true);
      }
    }

    function playPrev() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      if (isShuffle) {
        const nextIdx = Math.floor(Math.random() * TRACKS.length);
        loadTrack(nextIdx, true);
      } else {
        loadTrack((currentIndex - 1 + TRACKS.length) % TRACKS.length, true);
      }
    }

    // Volume without restarting
    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      if (val === 0) {
        audio.muted = true;
        volHighIcon.classList.add('hidden');
        volMuteIcon.classList.remove('hidden');
      } else {
        audio.muted = false;
        volHighIcon.classList.remove('hidden');
        volMuteIcon.classList.add('hidden');
      }
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      if (audio.muted) {
        volHighIcon.classList.add('hidden');
        volMuteIcon.classList.remove('hidden');
      } else {
        volHighIcon.classList.remove('hidden');
        volMuteIcon.classList.add('hidden');
      }
    });

    const speeds = [1.0, 1.25, 1.5];
    speedBtn.addEventListener('click', () => {
      const currIdx = speeds.indexOf(currentSpeed);
      currentSpeed = speeds[(currIdx + 1) % speeds.length];
      audio.playbackRate = currentSpeed;
      speedBtn.textContent = `${currentSpeed}x`;
    });

    const modes = ['bars', 'wave', 'pulse'];
    vizModeBtn.addEventListener('click', () => {
      const currIdx = modes.indexOf(visualizerMode);
      visualizerMode = modes[(currIdx + 1) % modes.length];
      vizModeLabel.textContent = visualizerMode.toUpperCase();
      modeOverlay.textContent = `${visualizerMode.toUpperCase()} VISUALIZER`;
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('text-teal-300', isShuffle);
      shuffleBtn.classList.toggle('text-teal-400/70', !isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      if (repeatMode === 'off') {
        repeatMode = 'all';
        repeatIndicator.classList.remove('hidden');
        repeatBtn.classList.add('text-teal-300');
      } else if (repeatMode === 'all') {
        repeatMode = 'one';
        repeatIndicator.classList.remove('hidden');
        repeatBtn.classList.add('text-teal-300');
      } else {
        repeatMode = 'off';
        repeatIndicator.classList.add('hidden');
        repeatBtn.classList.remove('text-teal-300');
      }
    });

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeLabel.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        durationLabel.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      if (repeatMode === 'one') {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } else {
        playNext();
      }
    });

    progressBar.addEventListener('input', () => { isSeeking = true; });
    progressBar.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
      isSeeking = false;
    });

    openPlaylistBtn.addEventListener('click', () => {
      playerView.classList.add('hidden');
      playlistView.classList.remove('hidden');
    });

    closePlaylistBtn.addEventListener('click', () => {
      playlistView.classList.add('hidden');
      playerView.classList.remove('hidden');
    });

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      TRACKS.forEach((track, idx) => {
        const item = document.createElement('div');
        const isCurrent = idx === currentIndex;
        item.className = `flex items-center justify-between p-2.5 rounded-xl transition-all cursor-pointer ${
          isCurrent ? 'bg-teal-950/90 border border-teal-500/60 shadow-[0_0_12px_rgba(15,139,141,0.4)]' : 'bg-black/35 hover:bg-teal-950/50 border border-transparent'
        }`;
        item.innerHTML = `
          <div class="flex items-center gap-3 truncate">
            <span class="w-6 text-center font-mono text-xs ${isCurrent ? 'text-teal-300 font-bold' : 'text-teal-400/50'}">
              ${isCurrent ? '▶' : (idx + 1).toString().padStart(2, '0')}
            </span>
            <div class="truncate text-left">
              <p class="text-sm font-semibold font-arabic ${isCurrent ? 'text-teal-100' : 'text-slate-200'} truncate">${track.title}</p>
              <p class="text-[10px] text-teal-400/60 font-mono">${track.artist}</p>
            </div>
          </div>
          <span class="text-[11px] font-mono text-teal-400/70 shrink-0">${track.duration}</span>
        `;
        item.addEventListener('click', () => {
          loadTrack(idx, true);
          playlistView.classList.add('hidden');
          playerView.classList.remove('hidden');
        });
        playlistContainer.appendChild(item);
      });
    }

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyN') {
        e.preventDefault();
        playNext();
      } else if (e.code === 'KeyP') {
        e.preventDefault();
        playPrev();
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        muteBtn.click();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        audio.currentTime = Math.min(audio.duration || 300, audio.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      }
    });

    // Real-Time Visualizer
    const vCtx = visualizerCanvas.getContext('2d');
    let vPhase = 0;

    function resizeVisualizer() {
      visualizerCanvas.width = visualizerCanvas.offsetWidth * window.devicePixelRatio;
      visualizerCanvas.height = visualizerCanvas.offsetHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeVisualizer);
    resizeVisualizer();

    function renderVisualizer() {
      const width = visualizerCanvas.width;
      const height = visualizerCanvas.height;
      vCtx.clearRect(0, 0, width, height);

      let hasRealData = false;
      if (analyser && isPlaying && audioDataArray) {
        try {
          analyser.getByteFrequencyData(audioDataArray);
          for (let i = 0; i < Math.min(24, audioDataArray.length); i++) {
            if (audioDataArray[i] > 10) {
              hasRealData = true;
              break;
            }
          }
        } catch {
          hasRealData = false;
        }
      }

      vPhase += isPlaying ? 0.08 : 0.015;

      if (visualizerMode === 'bars') {
        const barCount = 42;
        const barWidth = width / barCount;
        const gap = 2.5 * window.devicePixelRatio;

        for (let i = 0; i < barCount; i++) {
          let value = 0;
          if (hasRealData) {
            const freqRatio = Math.pow(i / barCount, 1.25);
            const index = Math.min(audioDataArray.length - 1, Math.floor(freqRatio * (audioDataArray.length * 0.85)));
            const raw = audioDataArray[index] || 0;
            const boost = i < barCount * 0.35 ? 1.35 : 1.0;
            value = Math.max(4 * window.devicePixelRatio, (raw / 255) * boost * height * 0.94);
          } else {
            const baseSin = Math.sin(vPhase + i * 0.28) * 0.5 + 0.5;
            const harmonic = Math.cos(vPhase * 1.6 + i * 0.45) * 0.35;
            const bassBoost = Math.sin((i / barCount) * Math.PI);
            const intensity = isPlaying ? (baseSin + harmonic) * bassBoost : 0.08 * bassBoost;
            value = Math.max(5 * window.devicePixelRatio, intensity * height * 0.85);
          }

          const x = i * barWidth + gap / 2;
          const y = height - value;
          const actualW = Math.max(1, barWidth - gap);

          const grad = vCtx.createLinearGradient(0, y, 0, height);
          grad.addColorStop(0, '#2dd4bf');
          grad.addColorStop(0.5, '#0d9488');
          grad.addColorStop(1, '#115e59');

          vCtx.fillStyle = grad;
          vCtx.fillRect(x, y, actualW, value);

          vCtx.fillStyle = isPlaying ? '#5eead4' : '#0f766e';
          vCtx.fillRect(x, Math.max(0, y - 2), actualW, 2);
        }
      } else if (visualizerMode === 'wave') {
        vCtx.beginPath();
        const slice = width / 60;
        let x = 0;
        for (let i = 0; i <= 60; i++) {
          let v = 0;
          if (hasRealData) {
            const idx = Math.floor((i / 60) * (audioDataArray.length / 2));
            const raw = audioDataArray[idx] || 128;
            v = 1 + ((raw - 128) / 128) * 0.9;
          } else {
            const freq = Math.sin(vPhase * 2 + i * 0.15) * Math.cos(vPhase + i * 0.08);
            v = isPlaying ? 1 + freq * 0.45 : 1 + Math.sin(vPhase + i * 0.1) * 0.05;
          }
          const y = (v * height) / 2;
          if (i === 0) vCtx.moveTo(x, y);
          else vCtx.lineTo(x, y);
          x += slice;
        }
        vCtx.strokeStyle = '#14b8a6';
        vCtx.lineWidth = 3 * window.devicePixelRatio;
        vCtx.stroke();
      } else if (visualizerMode === 'pulse') {
        const cx = width / 2;
        const cy = height / 2;
        const maxR = Math.min(width, height) * 0.45;
        let bass = 0.5;
        if (hasRealData) {
          bass = ((audioDataArray[0] || 0) + (audioDataArray[1] || 0) + (audioDataArray[2] || 0)) / (3 * 255);
        }
        for (let r = 1; r <= 4; r++) {
          const offset = (vPhase * (isPlaying ? 1.6 : 0.5) + r * 0.4) % 1;
          const radius = offset * maxR * (isPlaying ? 0.8 + bass * 0.7 : 1);
          const opacity = Math.max(0, 1 - offset);
          vCtx.beginPath();
          vCtx.arc(cx, cy, radius, 0, Math.PI * 2);
          vCtx.strokeStyle = `rgba(45, 212, 191, ${opacity * (isPlaying ? 0.85 : 0.2)})`;
          vCtx.lineWidth = 2 * window.devicePixelRatio;
          vCtx.stroke();
        }
      }

      requestAnimationFrame(renderVisualizer);
    }
    renderVisualizer();

    // Background Subtle Particles
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      particles = Array.from({ length: 35 }, () => ({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.3,
        size: Math.random() * 2 + 1,
        alpha: Math.random() * 0.35 + 0.1
      }));
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function renderBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < 0) p.y = bgCanvas.height;
        if (p.x < 0) p.x = bgCanvas.width;
        if (p.x > bgCanvas.width) p.x = 0;

        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(45, 212, 191, ${p.alpha * (isPlaying ? 1.2 : 0.6)})`;
        bgCtx.fill();
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // Load first track (ساكتة ليه)
    loadTrack(0);
  </script>
</body>
</html>
